<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - PennyPal AI | Your money. Smarter decisions.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="auth-wrapper">
    <div class="auth-card">
      <div class="auth-header">
        <div class="auth-brand">
          <i class="fa-solid fa-wallet"></i>
          <span>PennyPal AI</span>
        </div>
        <p class="auth-tagline">Create your personal financial account</p>
      </div>

      <div id="signup-alert-box" style="display: none; padding: 10px 14px; margin-bottom: 16px; border-radius: 6px; font-size: 0.875rem;"></div>

      <form id="signup-form">
        <div class="form-group">
          <label class="form-label" for="signup-name">Full Name</label>
          <input type="text" id="signup-name" class="form-control-custom" placeholder="John Doe" required autocomplete="name">
        </div>

        <div class="form-group">
          <label class="form-label" for="signup-email">Email Address</label>
          <input type="email" id="signup-email" class="form-control-custom" placeholder="name@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="signup-password">Password</label>
          <div class="password-wrapper">
            <input type="password" id="signup-password" class="form-control-custom" placeholder="At least 6 characters" required autocomplete="new-password">
            <button type="button" class="password-toggle" id="toggle-signup-password" title="Show/Hide Password">
              <i class="fa-regular fa-eye" id="signup-pwd-icon"></i>
            </button>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="signup-confirm-password">Confirm Password</label>
          <input type="password" id="signup-confirm-password" class="form-control-custom" placeholder="Re-enter password" required autocomplete="new-password">
        </div>

        <button type="submit" class="btn-primary-custom" id="signup-btn">
          <span>Create Account</span>
        </button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="/login">Sign In</a>
      </div>
    </div>
  </div>

  <div class="toast-container" id="toast-container"></div>
  <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
